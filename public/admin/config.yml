backend:
  name: git-gateway
  branch: main # Rama en la que se guardarán los cambios

media_folder: "public/images" # Carpeta para guardar las imágenes
public_folder: "/images" # Ruta pública para acceder a las imágenes

collections:
  - name: "docs"
    label: "Documentación"
    folder: "src/content/docs"
    create: true
    slug: "{{slug}}"
    fields:
      - {label: "Título", name: "title", widget: "string"}
      - {label: "Descripción", name: "description", widget: "string", required: false}
      - {label: "Cuerpo", name: "body", widget: "markdown"}
